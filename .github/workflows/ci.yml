name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Poda o target/ entre execuções; o cache cru crescia a cada build.
      - uses: Swatinem/rust-cache@v2

      # Só os testes sem rede; os de integração são #[ignore] e pedem credenciais.
      # --workspace: sem ele, só o pacote da raiz (o SDK) é testado.
      - name: Test
        run: cargo test --workspace --locked

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Poda o target/ entre execuções; o cache cru crescia a cada build.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
