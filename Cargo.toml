[workspace]
members = [".", "medx-mcp"]
resolver = "2"

# Uma versão para o workspace inteiro: SDK, medx-cli e medx-mcp saem juntos
# (bin/release).
[workspace.package]
version = "0.1.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LLawli/medx-sdk-oss"

[package]
name = "medx-sdk"
version.workspace = true
edition = "2021"
description = "SDK Rust para a API MedX"
license.workspace = true
repository.workspace = true

[lib]
name = "medx"
path = "src/lib.rs"

[[bin]]
name = "medx-cli"
path = "src/bin/cli.rs"

[features]
test-utils = []

[dependencies]
# rustls no lugar do OpenSSL (o padrão do reqwest): binários estáticos, sem
# libssl do sistema. As outras features são as padrão do reqwest.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
    "charset",
    "http2",
    "macos-system-configuration",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"
base64 = "0.22"
num-bigint-dig = "0.8"
thiserror = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# Liga as sequências ANSI no console clássico do Windows (conhost), que as
# mostra cruas por padrão. Já vem no lock pelo tokio.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
